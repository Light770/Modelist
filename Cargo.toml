[workspace]
members = [
    "crates/modelist-core",
    "crates/modelist-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
kurbo = "0.13"
cavalier_contours = "0.9"
rstar = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v5", "serde"] }
proptest = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
